name: Windows isolated updater NoPromote R157

on:
  pull_request:
    paths:
      - '.github/workflows/windows-updater-e2e-r157.yml'
      - 'auto-update-windows.ps1'
      - 'tools/run-owned-process-tree-windows.ps1'
      - 'tools/run-r157-standard-user.ps1'
      - 'tools/r157-standard-token-probe.mjs'
      - 'tools/diagnose-updater-gate-r470.ps1'
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'config.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: updater-no-promote-r157-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  isolated-windows-updater:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      # Reuse the pinned native build and SHA verification from CI.
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.427'

      - name: Build and verify the pinned native Job Object runner for the isolated updater
        shell: pwsh
        run: ./tools/windows-job-runner/verify-windows-job-runner.ps1 -Ensure

      - name: Exact-head preflight and private disposable state
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $expected='${{ github.event.pull_request.head.sha || github.sha }}'
          $head=(git rev-parse HEAD).Trim()
          if($expected -notmatch '^[0-9a-f]{40}$' -or $head -ne $expected){throw 'R157_HEAD_DRIFT'}
          $root=Join-Path $env:RUNNER_TEMP 'remote-commander-updater-r157'
          if(Test-Path $root){throw 'R157_NO_BLIND_RERUN'}
          if(Test-Path (Join-Path $env:LOCALAPPDATA 'ChatGPTRemoteCommander')){throw 'R157_EXISTING_USER_INSTALL'}
          foreach($area in @('INSTALL','STATE','ROAMING','TEMP')){
            New-Item -ItemType Directory -Path (Join-Path $root $area) -ErrorAction Stop | Out-Null
          }
          $c=Get-Content 'config.json' -Raw -Encoding UTF8|ConvertFrom-Json
          if($null -eq $c.autoUpdate -or $null -eq $c.powerMode){throw 'R157_CONFIG_SCHEMA'}
          $c.allowedRoots=@((Join-Path $root 'INSTALL'))
          $c.autoUpdate.enabled=$true
          $c.powerMode.enabled=$false
          $c.powerMode.guiControl.enabled=$false
          $c.powerMode.browserControl.enabled=$false
          # R161 negative side-effect fixture: a test-only provider tree must survive NoPromote.
          $legacy=Join-Path $root 'STATE\ChatGPTRemoteCommander\tools\codex-cli'
          New-Item -ItemType Directory -Path $legacy -ErrorAction Stop | Out-Null
          $marker=Join-Path $legacy 'R161-PRESERVE.txt'
          [IO.File]::WriteAllText($marker,'R161-NO-PROMOTE-PRESERVE',[Text.UTF8Encoding]::new($false))
          $path=Join-Path $root 'INSTALL\config.json'
          [IO.File]::WriteAllText($path,(ConvertTo-Json -InputObject $c -Depth 30)+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))
          $r=Get-Content $path -Raw|ConvertFrom-Json
          if(@($r.allowedRoots).Count -ne 1 -or $r.allowedRoots[0] -ne (Join-Path $root 'INSTALL') -or $r.powerMode.enabled -ne $false){throw 'R157_CONFIG_ISOLATION'}
          # Delivery and live state are siblings of INSTALL, never writable project roots.
          $privateHome=Join-Path $root 'USERPROFILE'
          $state=Join-Path $root 'STATE'
          $allowedWithSep=[IO.Path]::GetFullPath($r.allowedRoots[0]).TrimEnd([char[]]@([IO.Path]::DirectorySeparatorChar)) + [IO.Path]::DirectorySeparatorChar
          if($privateHome.StartsWith($allowedWithSep,[StringComparison]::OrdinalIgnoreCase) -or
             $state.StartsWith($allowedWithSep,[StringComparison]::OrdinalIgnoreCase)){
            throw 'R157_DELIVERY_STATE_INSIDE_ALLOWED_ROOT'
          }
          $tokens=$null;$errors=$null
          [Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'auto-update-windows.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if(@($errors).Count -ne 0){throw 'R157_UPDATER_PARSER'}
          [Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'tools\run-r157-standard-user.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if(@($errors).Count -ne 0){throw 'R157_STANDARD_USER_HELPER_PARSER'}
          [Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'tools\diagnose-updater-gate-r470.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if(@($errors).Count -ne 0){throw 'R470_DIAGNOSTIC_PARSER'}
          & node.exe --check (Join-Path $env:GITHUB_WORKSPACE 'tools\r157-standard-token-probe.mjs')
          if($LASTEXITCODE -ne 0){throw 'R157_NODE_TOKEN_PROBE_PARSER'}
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RC_E2E_ROOT=$root"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RC_E2E_SHA=$expected"
          Write-Output ('R157_PREFLIGHT_PASS_HEAD='+$head)

      - name: Actual candidate-first updater in isolated state (NoPromote)
        shell: pwsh
        timeout-minutes: 42
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $root=[string]$env:RC_E2E_ROOT
          $sha=[string]$env:RC_E2E_SHA
          if(-not $root -or $sha -notmatch '^[0-9a-f]{40}$'){throw 'R157_MISSING_PRESTATE'}
          $install=Join-Path $root 'INSTALL'
          # The exact-head updater independently verifies the native source hash.
          # Run the STANDARD candidate under a real non-elevated token; the server
          # correctly quarantines legacy MCP when its process token is elevated or unknown.
          $runner=Join-Path $env:GITHUB_WORKSPACE 'tools\windows-job-runner\dist\win-x64\CommanderWindowsJobRunner.exe'
          if(-not(Test-Path -LiteralPath $runner -PathType Leaf)){throw 'R157_PINNED_JOB_RUNNER_MISSING'}
          & pwsh.exe -NoLogo -NoProfile -NonInteractive -File .\tools\run-r157-standard-user.ps1 -Root $root -Workspace $env:GITHUB_WORKSPACE -ExpectedCommit $sha -InstallDir $install -WindowsJobRunnerPath $runner
          if($LASTEXITCODE -ne 0){throw ('R157_STANDARD_USER_UPDATER_FAILED_'+$LASTEXITCODE)}

      - name: Independently verify exact Job receipts and no promotion
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $root=[string]$env:RC_E2E_ROOT
          $sha=[string]$env:RC_E2E_SHA
          if(-not $root -or $sha -notmatch '^[0-9a-f]{40}$'){throw 'R157_VERIFY_PRESTATE_MISSING'}
          $cleanupPath=Join-Path $root 'R157_STANDARD_USER_CLEANUP.json'
          if(-not(Test-Path -LiteralPath $cleanupPath -PathType Leaf)){throw 'R157_STANDARD_USER_CLEANUP_RECEIPT_MISSING'}
          $cleanup=Get-Content -LiteralPath $cleanupPath -Raw -Encoding UTF8|ConvertFrom-Json
          if($cleanup.schema -ne 1 -or $cleanup.revision -ne 'R157_STANDARD_USER_CLEANUP' -or $cleanup.status -notin @('PASS','NOT_REQUIRED_STANDARD_PARENT') -or $cleanup.ownedProcesses -ne 0 -or ($cleanup.accountCreated -and -not $cleanup.userRemoved) -or (-not $cleanup.accountCreated -and $cleanup.userRemoved)){throw 'R157_STANDARD_USER_CLEANUP_NOT_ACCEPTED'}
          $state=Join-Path $root 'STATE\ChatGPTRemoteCommander'
          $marker=Join-Path $state 'tools\codex-cli\R161-PRESERVE.txt'
          if(-not(Test-Path -LiteralPath $marker -PathType Leaf) -or [IO.File]::ReadAllText($marker) -cne 'R161-NO-PROMOTE-PRESERVE'){throw 'R161_LEGACY_PROVIDER_MUTATED_IN_NOPROMOTE'}
          $reportPath=Join-Path $state 'last-update.json'
          if(-not(Test-Path $reportPath)){throw 'R157_NO_RESULT'}
          $report=Get-Content $reportPath -Raw -Encoding UTF8|ConvertFrom-Json
          if($report.status -ne 'CANDIDATE_PASS' -or [string]$report.commit -ne $sha){throw ('R157_BAD_RESULT_'+$report.status)}
          $profiles=@($report.profiles)
          if($profiles.Count -ne 1 -or $profiles[0].profile -ne 'default' -or $profiles[0].doctor -ne 'PASS' -or $profiles[0].hardware -ne 'PASS' -or $profiles[0].shadowStore -ne 'PASS' -or $profiles[0].liveStoreCompatibility -ne 'PASS'){throw 'R157_PROFILE_GATE_FAIL'}
          $jobs=@(Get-ChildItem (Join-Path $state 'update-logs') -File -Filter 'qualification-job-*.json')
          if($jobs.Count -ne 3){throw ('R157_JOB_COUNT_'+$jobs.Count)}
          foreach($file in $jobs){
            $j=Get-Content $file.FullName -Raw|ConvertFrom-Json
            if($j.status -ne 'PASS' -or $j.childExitCode -ne 0 -or $j.cleanupRequired -ne $false -or $j.timedOut -ne $false -or $j.activeAfterCleanup -ne 0){throw ('R157_JOB_NOT_ACCEPTED_'+$file.Name)}
          }
          $routePath=Join-Path $state 'routing'
          if(Test-Path $routePath){
            $routes=@(Get-ChildItem $routePath -Filter '*.json' -File|Where-Object{$_.Name -notlike '*.runtime.json'})
            if($routes.Count -gt 0){throw 'R157_UNEXPECTED_ROUTE_PROMOTION'}
          }
          $leftover=@(Get-CimInstance Win32_Process -Filter "Name='node.exe'"|Where-Object {([string]$_.CommandLine).Contains($root)})
          if($leftover.Count -gt 0){throw ('R157_ORPHANS_'+$leftover.Count)}
          $manifest=Join-Path $env:GITHUB_WORKSPACE 'package.json'
          if(-not(Test-Path -LiteralPath $manifest -PathType Leaf)){throw 'R157_SOURCE_PACKAGE_MISSING'}
          $sourceVersion=[string]((Get-Content -LiteralPath $manifest -Raw -Encoding UTF8|ConvertFrom-Json).version)
          if($sourceVersion -notmatch '^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-(?:dev|rc)\.[1-9]\d*)?$'){throw 'R157_SOURCE_VERSION_INVALID'}
          & node.exe (Join-Path $env:GITHUB_WORKSPACE 'tools/isolated-qa-policy.mjs')
          if($LASTEXITCODE -ne 0){throw 'R157_SOURCE_NOPROMOTE_POLICY_INVALID'}
          $stage=Join-Path $state ('releases\v'+$sourceVersion+'-'+$sha.Substring(0,12))
          if(-not(Test-Path $stage) -or (git -C $stage rev-parse HEAD).Trim() -ne $sha){throw 'R157_EXACT_STAGE_MISSING'}
          $receipt=[ordered]@{schema=1;revision='R157';status='PASS_HOSTED_WINDOWS_STANDARD_NOPROMOTE'
            exactCommit=$sha;qualifierReceipts=3;doctor='PASS';shadowStore='PASS'
            standardUserCleanup=$cleanup.status;standardUserAccountRemoved=[bool]$cleanup.userRemoved;standardUserOwnedProcesses=[int]$cleanup.ownedProcesses
            liveStoreCompatibility='PASS';g1Authorization='BLOCKED_NOT_CONFIGURED';ownedChildren=0;promoted=$false;stableBrowserUntouched=$true
            verifiedUtc=[DateTime]::UtcNow.ToString('o')}
          $dest=Join-Path $root 'RETURN_R157.json'
          [IO.File]::WriteAllText($dest,(ConvertTo-Json -InputObject $receipt -Depth 5)+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))
          Write-Output ('R157_PASS source='+$sha+' receiptSha='+(Get-FileHash $dest -Algorithm SHA256).Hash)
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '**R157 STANDARD CANARY PASS:** exact-head isolated Windows NoPromote, 3 qualification suites, positive Standard MCP Doctor and state checks, no route promotion or owned child leaks. G1 protected FULL_POWER/FULL_ACCESS authentication remains NOT VERIFIED; this is NOT Stable release acceptance.'
      - name: R470 derive a bounded, allowlisted failure diagnostic (no raw logs)
        if: ${{ failure() }}
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference='Stop'
          if(-not $env:RC_E2E_ROOT -or -not $env:RC_E2E_SHA){Write-Output 'R470_DIAG_PRESTATE_MISSING'; exit 0}
          & ./tools/diagnose-updater-gate-r470.ps1 -Root $env:RC_E2E_ROOT -ExpectedCommit $env:RC_E2E_SHA

      - name: Upload sanitized R470 failing-test receipt only
        if: ${{ failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc-r470-qualification-diagnostic
          path: ${{ runner.temp }}/remote-commander-updater-r157/DIAGNOSTIC_R470.json
          if-no-files-found: warn
          retention-days: 7
