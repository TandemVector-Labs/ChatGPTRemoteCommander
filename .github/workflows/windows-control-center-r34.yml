name: Windows Control Center R34

on:
  pull_request:
    paths:
      - 'desktop/RemoteCommanderDashboard/**'
      - 'desktop/tests-ui-r34/**'
      - 'test/profile-inventory-smoke/**'
      - 'desktop/install-windows.ps1'
      - 'test/windows-core-shortcut-contract.ps1'
      - 'test/ui-uninstall-preserve-r219.test.mjs'
      - 'test/ui-legacy-inplace-r224.*'
      - '.github/workflows/windows-control-center-r34.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-ui:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Validate Core Start Menu shortcut destinations (private fixtures only)
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File test/windows-core-shortcut-contract.ps1
      - name: Build native WinForms Control Center
        shell: pwsh
        run: dotnet build desktop/RemoteCommanderDashboard/RemoteCommanderDashboard.csproj -c Release --nologo -warnaserror
      - name: Headless native control/theme/metrics tests
        shell: pwsh
        run: dotnet run --project desktop/tests-ui-r34/R34UiTests.csproj -c Release --nologo
      - name: Isolated profile inventory security and live-shape fixture
        shell: pwsh
        run: dotnet run --project test/profile-inventory-smoke/IsolatedProfileInventorySmoke.csproj -c Release --nologo
      - name: Source safety regression
        shell: pwsh
        run: node --test desktop/tests-ui-r34/safety.test.cjs
      - name: Fail-closed generated Uninstall protection (R219)
        shell: pwsh
        run: node --test test/ui-uninstall-preserve-r219.test.mjs
      - name: Exact legacy UI in-place migration policy (R224)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node --test test/ui-legacy-inplace-r224.test.mjs
          if($LASTEXITCODE -ne 0){throw 'R224_STATIC_CONTRACT_FAILED'}
          & pwsh -NoLogo -NoProfile -NonInteractive -File test/ui-legacy-inplace-r224.ps1
          if($LASTEXITCODE -ne 0){throw 'R224_SYNTHETIC_NEGATIVE_CASES_FAILED'}
