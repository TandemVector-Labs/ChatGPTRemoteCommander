name: PR24 & main comparable CodeQL local threat-model QA (no upload)

on:
  push:
    branches: [qa/pr24-local-codeql-20261108]

permissions:
  contents: read
  actions: read
  security-events: read # local SARIF only; analyze upload is disabled

jobs:
  codeql-source:
    name: ${{ matrix.scope }} / ${{ matrix.language }} / no-upload
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: main-baseline
            sha: d946e4440c5743216f5f2ba7a8a315b5475ef7ab
            language: javascript-typescript
          - scope: pr24-merged
            sha: 17a137fd85d979d62ee0a60684d0d8d30a49b8cb
            language: javascript-typescript
    steps:
      - name: Check out the exact generated PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source ref and no QA overlay
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ matrix.sha }}"
          test -f .github/workflows/ci.yml
      - name: Initialize official CodeQL (pinned)
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
          config: |
            threat-models: local
      - name: Analyze locally without uploading to code scanning
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          upload: never
          upload-database: false
          output: sarif-results
      - name: Bounded SARIF security-rule triage (no snippets or uploads)
        shell: bash
        run: |
          python3 - <<'PY'
          import collections, json, pathlib, sys
          files = sorted(pathlib.Path('sarif-results').rglob('*.sarif'))
          if not files:
              sys.exit('NO_CODEQL_SARIF_FOUND')
          focus = {
              'py/overly-permissive-file',
              'js/file-system-race',
              'js/command-line-injection',
              'js/request-forgery',
              'js/bad-code-sanitization',
              'js/incomplete-url-substring-sanitization',
              'js/http-to-file-access',
              'js/file-access-to-http',
          }
          all_results, metadata = [], {}
          for f in files:
              obj = json.loads(f.read_text(encoding='utf-8'))
              runs = obj.get('runs', [])
              for run in runs:
                  all_results.extend(run.get('results', []))
                  for rule in run.get('tool', {}).get('driver', {}).get('rules', []):
                      metadata[rule.get('id', '')] = rule.get('properties', {})
              print('SARIF_FILE', f.name, 'RUNS', len(runs))
          groups = collections.defaultdict(list)
          for result in all_results:
              groups[result.get('ruleId', 'unknown')].append(result)
          print('CODEQL_SARIF_FINDINGS', len(all_results))
          print('CODEQL_SECURITY_RULE_COUNTS', sorted((key,len(val)) for key,val in groups.items() if key in focus))
          print('CODEQL_ALL_RULE_COUNTS', sorted((key,len(val)) for key,val in groups.items()))
          for ruleid in sorted(groups):
              if ruleid not in focus: continue
              properties = metadata.get(ruleid, {})
              severity = properties.get('security-severity', 'not_supplied')
              precision = properties.get('precision', 'not_supplied')
              paths = collections.Counter()
              for hit in groups[ruleid]:
                  locations=hit.get('locations', [])
                  if not locations: continue
                  loc=locations[0].get('physicalLocation',{}).get('artifactLocation',{}).get('uri','missing')
                  if '://' in loc or loc.startswith('/'): loc = pathlib.PurePosixPath(loc).name
                  paths[loc] += 1
              print('CODEQL_TRIAGE', json.dumps({
                  'rule':ruleid,'findings':len(groups[ruleid]),
                  'security_severity':severity,'precision':precision,
                  'file_counts':paths.most_common(15),
              },sort_keys=True))
          # Route-specific, bounded CodeQL path evidence; file/line metadata only.
          for ruleid in ('js/request-forgery','js/file-access-to-http','js/command-line-injection'):
              for hit in groups.get(ruleid,[])[:15]:
                  locs=hit.get('locations',[])
                  primary=locs[0].get('physicalLocation',{}) if locs else {}
                  relative=primary.get('artifactLocation',{}).get('uri','')
                  if relative!='tools/commander-transfer-mesh/doctor.mjs': continue
                  line=primary.get('region',{}).get('startLine')
                  flow_paths=[]
                  for flow in hit.get('codeFlows',[])[:1]:
                      for thread in flow.get('threadFlows',[])[:1]:
                          points=thread.get('locations',[])
                          for item in (points[:3]+points[-3:]):
                              p=item.get('location',{}).get('physicalLocation',{})
                              f=p.get('artifactLocation',{}).get('uri','')
                              if '://' in f or f.startswith('/'): f=pathlib.PurePosixPath(f).name
                              flow_paths.append({'file':f[:130], 'line':p.get('region',{}).get('startLine')})
                  print('CODEQL_DOCTOR_NETWORK_FLOW',json.dumps({'rule':ruleid,'line':line,'flow':flow_paths},sort_keys=True))
          PY
