name: PR238 exact-head comparative CodeQL QA (no upload)
on:
  push:
    branches: [qa/pr238-exact-codeql-20261128]
    paths: ['.github/workflows/qa-pr238-exact-codeql-20261128.yml']
permissions:
  contents: read
  actions: read
  security-events: read
jobs:
  compare:
    name: ${{ matrix.scope }} / JavaScript-TypeScript / no-upload
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: parent-238-pretrusted
            sha: f0160d07405aa2b7e9fcb562b44acd27f566bd9e
          - scope: candidate-238-trusted
            sha: 47d82b482ad1ed9e537cc5677ea0a432d0629db8
    steps:
      - name: Exact immutable public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check exact source identity
        run: test "$(git rev-parse HEAD)" = "${{ matrix.sha }}"
      - name: Initialize pinned CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality
          config: |
            threat-models: local
      - name: Analyze without upload or database publication
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          upload: never
          upload-database: false
          output: sarif-results
      - name: Report bounded aggregate evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import collections, json, pathlib
          files=sorted(pathlib.Path('sarif-results').rglob('*.sarif'))
          assert files, 'NO_SARIF'
          counts=collections.Counter()
          focus=collections.Counter()
          engines=set()
          total=0
          for f in files:
              for run in json.loads(f.read_text(encoding='utf-8')).get('runs',[]):
                  driver=run.get('tool',{}).get('driver',{})
                  engines.add((driver.get('name','unknown'),driver.get('semanticVersion',driver.get('version','unknown'))))
                  for result in run.get('results',[]):
                      total+=1
                      rule=result.get('ruleId','unknown')
                      counts[rule]+=1
                      locs=result.get('locations',[])
                      uri=(locs[0].get('physicalLocation',{}).get('artifactLocation',{}).get('uri','') if locs else '')
                      for name in ('tools/commander-transfer-mesh/pilot-cli.mjs','test/transfer-dest-guard-active-20261023.test.mjs','test/transfer-dest-guard-contract-20261023.test.mjs'):
                          if uri==name or uri.endswith('/'+name):
                              focus[(name,rule)]+=1
          print('CODEQL_ENGINES',json.dumps(sorted(engines)))
          print('CODEQL_TOTAL',total)
          print('CODEQL_RULE_COUNTS',json.dumps(sorted(counts.items())))
          print('CODEQL_FOCUS_COUNTS',json.dumps(sorted((p,r,c) for (p,r),c in focus.items())))
          # Bounded metadata, without messages, source snippets, absolute paths or raw SARIF.
          import hashlib
          from urllib.parse import unquote
          focus_files={'src/transfer-tools.mjs','test/transfer-trusted-linux-ancestry-20261128.test.mjs','test/transfer-dest-guard-active-20261023.test.mjs','test/transfer-dest-guard-contract-20261023.test.mjs','tools/commander-transfer-mesh/pilot-cli.mjs'}
          watch_rules={'js/path-injection','js/resource-exhaustion','js/user-controlled-bypass','js/command-line-injection','js/file-system-race'}
          def relative(uri):
              v=unquote(uri).replace(chr(92),'/')
              if v.startswith('/') or ':' in v or '..' in v.split('/') or len(v)>220:
                  return '<nonrelative>'
              return v.removeprefix('./')
          by_file=collections.Counter()
          identities=[]
          for f in files:
              for run in json.loads(f.read_text(encoding='utf-8')).get('runs',[]):
                  for result in run.get('results',[]):
                      rule=result.get('ruleId','unknown')
                      locs=result.get('locations',[])
                      physical=locs[0].get('physicalLocation',{}) if locs else {}
                      uri=relative(physical.get('artifactLocation',{}).get('uri',''))
                      region=physical.get('region',{})
                      if rule in watch_rules:
                          by_file[(uri,rule)]+=1
                      if uri not in focus_files and rule!='js/command-line-injection':
                          continue
                      fingerprints=result.get('partialFingerprints',{}) or result.get('fingerprints',{})
                      fp=hashlib.sha256(json.dumps(fingerprints,sort_keys=True).encode()).hexdigest() if fingerprints else None
                      identities.append([uri,rule,region.get('startLine'),region.get('startColumn'),fp])
          assert sum(by_file.values())==sum(counts[r] for r in watch_rules)
          print('CODEQL_WATCH_BY_FILE',json.dumps(sorted((p,r,c) for (p,r),c in by_file.items())))
          print('CODEQL_FOCUS_IDENTITIES',json.dumps(sorted(identities,key=lambda x:json.dumps(x))))
          # Bounded metadata-only taint routes for three NEW read guards.
          guarded={
              'b73ebde5e86f4389a0693f06e8e10831057e53db7f5a7ecf0c432e932ee04068':'lstat-precheck',
              '42a5b26e7ccbe6139358a88ed8ca515b10403b543e4a5773c3d77e15d3c27ad7':'exists-pinned-target',
              '232a8ec1b949e1a96132a8d6d307d7b075787e9f6555620fce7dad1a88869f51':'lstat-postcheck'
          }
          flow_evidence=[]
          for f in files:
              for sarif_run in json.loads(f.read_text(encoding='utf8')).get('runs',[]):
                  for finding in sarif_run.get('results',[]):
                      if finding.get('ruleId')!='js/path-injection':
                          continue
                      locations=finding.get('locations',[])
                      physical=locations[0].get('physicalLocation',{}) if locations else {}
                      if relative(physical.get('artifactLocation',{}).get('uri',''))!='tools/commander-transfer-mesh/pilot-cli.mjs':
                          continue
                      prints=finding.get('partialFingerprints',{}) or finding.get('fingerprints',{})
                      identity=hashlib.sha256(json.dumps(prints,sort_keys=True).encode()).hexdigest() if prints else None
                      if identity not in guarded:
                          continue
                      flows=[]
                      for codeflow in finding.get('codeFlows',[])[:2]:
                          for thread in codeflow.get('threadFlows',[])[:2]:
                              locs=thread.get('locations',[])
                              nodes=[]
                              for point in locs[:20]:
                                  loc=point.get('location',{}).get('physicalLocation',{})
                                  region=loc.get('region',{})
                                  nodes.append([relative(loc.get('artifactLocation',{}).get('uri','')),
                                      region.get('startLine'),region.get('startColumn')])
                              flows.append({'nodes':nodes,'length':len(locs)})
                      flow_evidence.append({'guard':guarded[identity],
                           'sinkLine':physical.get('region',{}).get('startLine'),
                           'codeflowCount':len(finding.get('codeFlows',[])),
                           'flows':flows})
          assert len(flow_evidence)<=3,flow_evidence
          print('CODEQL_NEW_GUARD_FLOWS',json.dumps(sorted(flow_evidence,key=lambda x:x['guard'])))
          PY
