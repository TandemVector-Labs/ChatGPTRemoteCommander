name: Core real promotion and rollback R173 (isolated Windows)

on:
  pull_request:
    paths:
      - '.github/workflows/release-rollback-windows-r173.yml'
      - 'test/release-rollback-windows-r173.ps1'
      - 'test/router-ports-windows-r189.ps1'
      - 'auto-update-windows.ps1'
      - 'tools/router-switch.mjs'
      - 'tools/run-owned-process-tree-windows.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-rollback-r173-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  windows-real-rollback:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pinned
        with:
          node-version: '24'
      - name: Static parser, exact source and temporary host guard
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $sha='${{ github.event.pull_request.head.sha || github.sha }}'
          if((git rev-parse HEAD).Trim() -ne $sha){throw 'R173_WRONG_CHECKOUT_SHA'}
          $candidateVersion=[string]((Get-Content package.json -Raw|ConvertFrom-Json).version)
          & node.exe tools/isolated-qa-policy.mjs
          if($LASTEXITCODE -ne 0){throw 'R173_UNSUPPORTED_VERSION'}
          if($candidateVersion -eq '0.10.25') {
            $rollbackMode='V025W'
            $testScript='test/release-rollback-windows-v01025.ps1'
            $rootName='remote-commander-rollback-v025w'
          } else {
            $rollbackMode='R173'
            $testScript='test/release-rollback-windows-r173.ps1'
            $rootName='remote-commander-rollback-r173'
          }
          $tokens=$null;$errs=$null
          [Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $testScript),[ref]$tokens,[ref]$errs)|Out-Null
          if(@($errs).Count){throw ('R173_PARSER_ERRORS_'+@($errs).Count)}
          & pwsh.exe -NoLogo -NoProfile -NonInteractive -File test/router-ports-windows-r189.ps1 -SelfTest
          if($LASTEXITCODE -ne 0){throw 'R189_ROUTER_SCHEMA_NEGATIVE_TESTS_FAILED'}
          $p=Join-Path $env:RUNNER_TEMP $rootName
          if(Test-Path $p){throw 'R173_NO_BLIND_RERUN'}
          if(Test-Path (Join-Path $env:LOCALAPPDATA 'ChatGPTRemoteCommander')){throw 'R173_PREEXISTING_INSTALL'}
          ('ROLLBACK_MODE='+$rollbackMode) >> $env:GITHUB_ENV
          Write-Output ('R173_STATIC_EXACT_HEAD_PRESTATE_PASS mode='+$rollbackMode)
      - name: Real supported candidate promotion then stable v0.10.20 rollback
        shell: pwsh
        timeout-minutes: 53
        run: |
          $ErrorActionPreference='Stop'
          $testScript=if($env:ROLLBACK_MODE -eq 'V025W'){'test/release-rollback-windows-v01025.ps1'}else{'test/release-rollback-windows-r173.ps1'}
          & pwsh.exe -NoLogo -NoProfile -NonInteractive -File $testScript -ExpectedCommit '${{ github.event.pull_request.head.sha || github.sha }}'
          if($LASTEXITCODE -ne 0){throw ('R173_NONZERO_'+$LASTEXITCODE)}
      - name: Upload scoped CI-only evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r173-windows-promotion-rollback-evidence
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/remote-commander-rollback-r173/RETURN_R173.json
            ${{ runner.temp }}/remote-commander-rollback-r173/PROMOTE.stdout.log
            ${{ runner.temp }}/remote-commander-rollback-r173/PROMOTE.stderr.log
            ${{ runner.temp }}/remote-commander-rollback-r173/ROLLBACK.stdout.log
            ${{ runner.temp }}/remote-commander-rollback-r173/ROLLBACK.stderr.log
            ${{ runner.temp }}/remote-commander-rollback-r173/ROUTE_PROMOTE.json
            ${{ runner.temp }}/remote-commander-rollback-r173/ROUTE_ROLLBACK.json
            ${{ runner.temp }}/remote-commander-rollback-v025w/DIAGNOSTIC_R470.json
